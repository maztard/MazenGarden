<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" shape-rendering="crispEdges">
  <!-- Hand-drawn 18x18 pixel SVG representing 🤑 (money-mouth face, U+1F911) -->
  <!-- Outline / Base circular face -->
  <rect x="5" y="1" width="8" height="1" fill="#000000" />
  <rect x="3" y="2" width="2" height="1" fill="#000000" />
  <rect x="5" y="2" width="8" height="1" fill="#ffd83d" />
  <rect x="13" y="2" width="2" height="1" fill="#000000" />
  <rect x="2" y="3" width="1" height="2" fill="#000000" />
  <rect x="3" y="3" width="12" height="2" fill="#ffd83d" />
  <rect x="15" y="3" width="1" height="2" fill="#000000" />
  <rect x="1" y="5" width="1" height="8" fill="#000000" />
  <rect x="2" y="5" width="14" height="8" fill="#ffd83d" />
  <rect x="16" y="5" width="1" height="8" fill="#000000" />
  <rect x="2" y="13" width="1" height="2" fill="#000000" />
  <rect x="3" y="13" width="12" height="2" fill="#ffd83d" />
  <rect x="15" y="13" width="1" height="2" fill="#000000" />
  <rect x="3" y="15" width="2" height="1" fill="#000000" />
  <rect x="5" y="15" width="8" height="1" fill="#ffd83d" />
  <rect x="13" y="15" width="2" height="1" fill="#000000" />
  <rect x="5" y="16" width="8" height="1" fill="#000000" />

  <!-- Dollar Eyes ($) in Green -->
  <!-- Left eye at x: 4..6, y: 5..8 -->
  <rect x="4" y="5" width="3" height="1" fill="#2e7d32" />
  <rect x="4" y="6" width="2" height="1" fill="#2e7d32" />
  <rect x="5" y="7" width="2" height="1" fill="#2e7d32" />
  <rect x="4" y="8" width="3" height="1" fill="#2e7d32" />
  <rect x="5" y="4" width="1" height="6" fill="#1b5e20" />

  <!-- Right eye at x: 11..13, y: 5..8 -->
  <rect x="11" y="5" width="3" height="1" fill="#2e7d32" />
  <rect x="11" y="6" width="2" height="1" fill="#2e7d32" />
  <rect x="12" y="7" width="2" height="1" fill="#2e7d32" />
  <rect x="11" y="8" width="3" height="1" fill="#2e7d32" />
  <rect x="12" y="4" width="1" height="6" fill="#1b5e20" />

  <!-- Smile / Mouth Outline -->
  <rect x="6" y="10" width="6" height="1" fill="#212121" />
  <rect x="5" y="11" width="1" height="2" fill="#212121" />
  <rect x="12" y="11" width="1" height="2" fill="#212121" />
  <rect x="6" y="13" width="6" height="1" fill="#212121" />

  <!-- Dollar Tongue sticking out -->
  <rect x="7" y="11" width="4" height="4" fill="#4caf50" />
  <rect x="8" y="15" width="2" height="1" fill="#4caf50" />
  <!-- Tongue dollar line -->
  <rect x="8" y="11" width="2" height="4" fill="#1b5e20" />
</svg>
